services:
  - type: web
    name: yego-shecan-backend
    runtime: node
    region: frankfurt
    plan: free
    branch: ardine
    
    rootDir: Backend
    
    buildCommand: "npm install && npx tsc --project tsconfig.json"
    
    startCommand: "npm start"
    
    envVars:
      - key: NODE_ENV
        value: production