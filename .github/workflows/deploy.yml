name: Deployment to Andasy
on:
  push:
    branches:
      - ardine
jobs:
  deploy:
    name: Deploy App
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v2
        - uses: quarksgroup/andasy-action@main
          with:
            project_path: Website/frontend
          env:
          # Set access token
            ANDASY_ACCESS_TOKEN: ${{ secrets.ANDASY }}
